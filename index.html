
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animal Classification System</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #101410;
      color: #f3f7f0;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 480px;
      margin: auto;
      padding: 20px;
      background: #1b241d;
      border: 1px solid #526d48;
      border-radius: 18px;
    }

    h1 { color: #b7f36b; font-size: 25px; }

    video, img {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      background: #080b08;
      border-radius: 12px;
      margin: 12px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 0;
      border-radius: 10px;
      background: #b7f36b;
      color: #15200f;
      font-weight: bold;
      font-size: 16px;
    }

    button:disabled { opacity: .5; }

    .result {
      margin-top: 12px;
      padding: 12px;
      background: #29352a;
      border-radius: 8px;
      text-align: left;
    }

    progress { width: 100%; accent-color: #b7f36b; }
    #status { color: #d4e7c9; font-size: 14px; }
  </style>
</head>

<body>
  <main class="card">
    <h1>ANIMAL CLASSIFIER</h1>
    <p>Capture an animal photo, then classify it.</p>

    <video id="camera" autoplay playsinline hidden></video>
    <img id="preview" alt="Captured animal photo" hidden>

    <button id="startButton">Take Picture</button>
    <button id="captureButton" hidden>Capture Photo</button>
    <button id="retakeButton" hidden>Retake Photo</button>
    <button id="classifyButton" disabled>Classify Animal</button>

    <p id="status">Loading your animal model...</p>

    <section id="results" hidden>
      <div class="result">
        <strong>Tiger</strong>
        <span id="tigerScore">0%</span>
        <progress id="tigerBar" max="100" value="0"></progress>
      </div>

      <div class="result">
        <strong>Shark</strong>
        <span id="sharkScore">0%</span>
        <progress id="sharkBar" max="100" value="0"></progress>
      </div>

      <div class="result">
        <strong>Eagle</strong>
        <span id="eagleScore">0%</span>
        <progress id="eagleBar" max="100" value="0"></progress>
      </div>

      <h2 id="prediction"></h2>
    </section>

    <canvas id="photoCanvas" hidden></canvas>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>

  <script>
    const MODEL_URL =
      "https://teachablemachine.withgoogle.com/models/xWt4riPxb5/";

    const camera = document.getElementById("camera");
    const preview = document.getElementById("preview");
    const canvas = document.getElementById("photoCanvas");
    const startButton = document.getElementById("startButton");
    const captureButton = document.getElementById("captureButton");
    const retakeButton = document.getElementById("retakeButton");
    const classifyButton = document.getElementById("classifyButton");
    const statusText = document.getElementById("status");

    let model = null;
    let stream = null;
    let photoReady = false;

    async function loadModel() {
      try {
        model = await tmImage.load(
          MODEL_URL + "model.json",
          MODEL_URL + "metadata.json"
        );
        statusText.textContent = "Model ready. Take a picture to begin.";
      } catch (error) {
        statusText.textContent =
          "Could not load the model. Check your internet connection and model URL.";
        console.error(error);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      camera.srcObject = null;
    }

    startButton.addEventListener("click", async () => {
      try {
        stopCamera();
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });

        camera.srcObject = stream;
        camera.hidden = false;
        preview.hidden = true;
        captureButton.hidden = false;
        retakeButton.hidden = true;
        classifyButton.disabled = true;
        startButton.textContent = "Camera Open";
        photoReady = false;
        statusText.textContent = "Position the animal and capture your photo.";
        document.getElementById("results").hidden = true;
      } catch (error) {
        statusText.textContent =
          "Camera access failed. Open this page over HTTPS and allow camera permission.";
        console.error(error);
      }
    });

    captureButton.addEventListener("click", () => {
      if (!camera.videoWidth) {
        statusText.textContent = "Wait for the camera to start.";
        return;
      }

      canvas.width = camera.videoWidth;
      canvas.height = camera.videoHeight;
      canvas.getContext("2d").drawImage(
        camera, 0, 0, canvas.width, canvas.height
      );

      preview.src = canvas.toDataURL("image/jpeg", 0.9);
      preview.hidden = false;
      camera.hidden = true;
      stopCamera();

      captureButton.hidden = true;
      retakeButton.hidden = false;
      startButton.textContent = "Take Another Picture";
      classifyButton.disabled = !model;
      photoReady = true;
      statusText.textContent = "Photo captured. Tap Classify Animal.";
    });

    retakeButton.addEventListener("click", () => {
      startButton.click();
    });

    classifyButton.addEventListener("click", async () => {
      if (!model || !photoReady) {
        statusText.textContent = "Take a picture first.";
        return;
      }

      classifyButton.disabled = true;
      statusText.textContent = "Analyzing your photo...";

      try {
        const predictions = await model.predict(preview);
        const classScores = {};

        predictions.forEach(item => {
          classScores[item.className.trim().toLowerCase()] =
            item.probability * 100;
        });

        const animals = [
          { key: "tiger", score: classScores["tiger"] ?? 0 },
          { key: "shark", score: classScores["shark"] ?? 0 },
          { key: "eagle", score: classScores["eagle"] ?? 0 }
        ];

        animals.forEach(animal => {
          document.getElementById(animal.key + "Score").textContent =
            animal.score.toFixed(1) + "%";
          document.getElementById(animal.key + "Bar").value =
            animal.score;
        });

        animals.sort((a, b) => b.score - a.score);
        document.getElementById("prediction").textContent =
          "Prediction: " + animals[0].key.toUpperCase();

        document.getElementById("results").hidden = false;
        statusText.textContent = "Classification complete.";
      } catch (error) {
        statusText.textContent = "Classification failed. Try another photo.";
        console.error(error);
      } finally {
        classifyButton.disabled = false;
      }
    });

    window.addEventListener("pagehide", stopCamera);
    loadModel();
  </script>
</body>
</html>
